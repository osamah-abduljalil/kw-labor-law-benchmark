[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kw-labor-law-benchmark"
version = "0.1.0"
description = "SLED: Evaluating LLMs as Answerers and Judges for Low-Resource Domain-Specific Legal QAs"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Osamah Abduljalil" },
    { name = "Hessah Alfurih" },
    { name = "Waad Alhoshan" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "sentence-transformers>=2.2.2",
    "faiss-cpu>=1.7.4",
    "rank-bm25>=0.2.2",
    "transformers>=4.38.0",
    "torch>=2.0.0",
    "openai>=1.12.0",
    "google-generativeai>=0.4.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.66.0",
    "tenacity>=8.2.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
where = ["src"]
